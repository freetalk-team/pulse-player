appId: io.sipme.pulseplayer
productName: Pulse Player
directories:
  buildResources: build
files:
  - "out/**/*"
  - "package.json"
  - '!**/.vscode/*'
  - '!src/**'
  - '!native/src/**'
  - '!native/build/**/*.o'
  - '!native/build/**/*.a'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources:
  - from: "resources/web"
    to: "web"
asar: true
asarUnpack:
  - resources/**
win:
  executableName: pulse-player
  icon: icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    # - snap
    # - deb
  syncDesktopName: true
  desktop:
    entry:
      Name: Pulse Player
      Comment: Modern, lightweight media player
      Categories: AudioVideo;Audio;Video;Network
      Keywords: audio;video;player
      StartupWMClass: pulse-player       # helps window managers match window to icon
      Terminal: false
      Type: Application
  executableName: pulse-player
  maintainer: Pavel Patarinski <pavel.patarinski@gmail.com>
  vendor: Freetalk Team
  category: Audio
  icon: icon.png
  synopsis: Pulse Player
  description: Play and organize your music
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
