appId: io.sipme.pulseplayer
productName: Pulse Player
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!src/**"
  - "!native/src/**"
  - "!native/build/**/*.o"
  - "!native/build/**/*.a"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!svelte.config.mjs"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
extraResources:
  - from: resources/web
    to: web
asar:
  unpack:
    - resources/**
win:
  executableName: pulse-player
  icon: icon.ico
  artifactName: ${name}-windows-${arch}.${ext}
  target:
    - nsis
    - zip
nsis:
  artifactName: ${name}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: installer.nsh
mac:
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  sign:
    entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  artifactName: ${name}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
    - tar.gz
  desktop:
    entry:
      Name: Pulse Player
      Comment: Modern, lightweight media player
      Categories: AudioVideo;Audio;Video;Network
      Keywords: audio;video;player
      StartupWMClass: pulse-player
      Terminal: false
      Type: Application
  executableName: pulse-player
  maintainer: Pavel Patarinski <pavel.patarinski@gmail.com>
  vendor: Freetalk Team
  category: Audio
  icon: icon.png
  synopsis: Pulse Player
  description: Play and organize your music
publish:
  provider: github
  owner: freetalk-team
  repo: pulse-player
  channel: latest-${arch}
nativeModules:
  npmRebuild: false
